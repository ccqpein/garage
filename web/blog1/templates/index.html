{% extends "base.html" %}

{% block title %}{{ config.blog.title }} - Home{% endblock %}

{% block content %}
<div class="space-y-8">
    <!-- Search Input Section -->
    <div class="relative max-w-xl">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
        </div>
        <input type="text"
               name="q"
               hx-post="/api/search"
               hx-trigger="keyup changed delay:200ms"
               hx-target="#search-results"
               placeholder="Search posts by title, tag, or summary..."
               class="w-full pl-11 pr-4 py-3 bg-slate-900/90 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-inner text-sm" />
    </div>

    <!-- Post Listing Container -->
    <div id="search-results" class="space-y-4">
        {% include "partials/search_results.html" %}
    </div>
</div>
{% endblock %}
