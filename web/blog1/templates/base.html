<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.blog.title }}{% endblock %}</title>
    <meta name="description" content="{{ config.blog.description }}">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/htmx.min.js" defer></script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased font-sans min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">
    <!-- Background Gradient Orbs -->
    <div class="fixed top-0 left-1/4 -translate-x-1/2 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none -z-10"></div>
    <div class="fixed top-1/3 right-1/4 translate-x-1/2 w-96 h-96 bg-purple-600/10 rounded-full blur-3xl pointer-events-none -z-10"></div>

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 glass-panel border-b border-slate-800/80">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
            <a href="/" class="group flex flex-col justify-center">
                <h1 class="text-lg font-bold tracking-tight text-white group-hover:text-indigo-400 transition-colors">
                    {{ config.blog.title }}
                </h1>
                <p class="text-xs text-slate-400 font-mono">In building, I become</p>
            </a>
            
            <nav class="flex items-center gap-6 text-sm font-medium">
                <a href="/" class="text-slate-300 hover:text-white transition-colors">Posts</a>
                <a href="https://github.com/ccqpein" target="_blank" rel="noopener" class="text-slate-400 hover:text-slate-200 transition-colors">
                    GitHub
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 bg-slate-950/80 py-8 mt-12 text-center text-xs text-slate-500">
        <div class="max-w-4xl mx-auto px-4 flex items-center justify-between">
            <p>© 2026 {{ config.blog.author }}</p>
        </div>
    </footer>

    <script>
        (function() {
            function getHeaderOffset() {
                const header = document.querySelector('header');
                return header ? header.getBoundingClientRect().height + 24 : 96;
            }

            function scrollToHash() {
                if (!window.location.hash) return;
                const id = decodeURIComponent(window.location.hash.substring(1));
                const target = document.getElementById(id);
                if (target) {
                    const offset = getHeaderOffset();
                    const targetTop = target.getBoundingClientRect().top + window.pageYOffset - offset;
                    window.scrollTo({
                        top: Math.max(0, targetTop),
                        behavior: 'smooth'
                    });
                }
            }

            // Clicking a heading adds the #tag to the URL without jumping/scrolling
            document.addEventListener('click', function(e) {
                const link = e.target.closest('.heading-permalink');
                if (link) {
                    const href = link.getAttribute('href');
                    if (href && href.startsWith('#')) {
                        e.preventDefault();
                        history.pushState(null, '', href);
                    }
                }
            });

            // Visiting or refreshing the page with a #tag scrolls to the heading
            window.addEventListener('DOMContentLoaded', function() {
                if (window.location.hash) {
                    setTimeout(scrollToHash, 60);
                }
            });

            // Back/Forward browser navigation with #tag
            window.addEventListener('popstate', function() {
                if (window.location.hash) {
                    setTimeout(scrollToHash, 20);
                }
            });
        })();
    </script>
</body>
</html>
